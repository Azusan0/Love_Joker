<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Share Cover</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7fb;
        --card: #ffffff;
        --text: #16181c;
        --muted: #8d96a3;
        --link: #97a6bd;
        --shadow: 0 28px 70px rgba(67, 85, 120, 0.12);
        --border: rgba(209, 216, 228, 0.72);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        background:
          radial-gradient(circle at 12% 10%, rgba(154, 190, 255, 0.22), transparent 24%),
          radial-gradient(circle at 92% 12%, rgba(255, 212, 228, 0.22), transparent 18%),
          linear-gradient(180deg, #f9fbff 0%, var(--bg) 100%);
        color: var(--text);
      }

      body {
        padding: 38px;
      }

      .phone {
        width: 100%;
        height: 100%;
        padding: 28px 30px 24px;
        border-radius: 16px;
        background: var(--card);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        display: grid;
        grid-template-rows: auto 1fr auto auto;
        align-content: start;
        gap: 18px;
        overflow: hidden;
      }

      .top {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .avatar {
        width: 70px;
        height: 70px;
        border-radius: 999px;
        background:
          radial-gradient(circle at 38% 34%, rgba(255, 255, 255, 0.16), transparent 22%),
          linear-gradient(135deg, #262a35 0%, #5a6476 100%);
        position: relative;
        overflow: hidden;
      }

      .avatar::after {
        content: "";
        position: absolute;
        inset: 12px;
        border-radius: 999px;
        border: 2px solid rgba(255, 255, 255, 0.16);
      }

      .identity {
        display: grid;
        gap: 6px;
      }

      .name {
        margin: 0;
        font-size: 32px;
        font-weight: 700;
        letter-spacing: 0;
      }

      .time {
        margin: 0;
        font-size: 20px;
        color: var(--muted);
      }

      .copy {
        position: relative;
        display: grid;
        gap: 8px;
        padding-right: 14px;
        align-content: start;
      }

      .line {
        margin: 0;
        font-size: 38px;
        line-height: 1.32;
        letter-spacing: 0;
      }

      .line--short {
        width: 92%;
      }

      .line--fade {
        width: 84%;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .more {
        position: relative;
        margin-top: -6px;
        font-size: 28px;
        line-height: 1.2;
        color: var(--link);
        font-weight: 500;
      }

      .fade {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 12px;
        height: 54px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0), var(--card));
        pointer-events: none;
      }

      .footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: var(--muted);
        font-size: 20px;
      }

      .footer span {
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: #ccd3df;
      }
    </style>
  </head>
  <body>
    <main class="phone">
      <header class="top">
        <div class="avatar" aria-hidden="true"></div>
        <div class="identity">
          <p class="name">麻衣酱</p>
          <p class="time">今天 19:18</p>
        </div>
      </header>

      <section class="copy" aria-label="长文预览">
        <p class="line">终于到520了其实有些话我真的很早就想对你说了</p>
        <p class="line">这些天每次想到你我都觉得应该认真一点把那些</p>
        <p class="line">别扭犹豫心动和小小的期待慢慢写给你看所以我</p>
        <p class="line line--short">把它们整理成了一封小小的信想趁今天发给你</p>
        <p class="line line--fade">如果你愿意的话就继续往下看吧后面还有一些没写完的话…</p>
        <div class="fade" aria-hidden="true"></div>
      </section>

      <p class="more">查看全文</p>

      <footer class="footer">
        <span><i class="dot"></i> Xiaomi 14 Ultra (5G)</span>
        <span>点赞&nbsp;&nbsp;评论&nbsp;&nbsp;分享</span>
      </footer>
    </main>
  </body>
</html>
