<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Share Cover</title>
    <style>
      :root {
        color-scheme: light;
        --bg-1: #fff4f6;
        --bg-2: #fff8f1;
        --paper: rgba(255, 252, 249, 0.96);
        --paper-edge: rgba(233, 220, 213, 0.96);
        --ink: #2d2423;
        --muted: #7b6a64;
        --accent: #e96a82;
        --accent-soft: rgba(233, 106, 130, 0.14);
        --shadow: 0 28px 80px rgba(74, 40, 46, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        background:
          radial-gradient(circle at 20% 18%, rgba(233, 106, 130, 0.16), transparent 24%),
          radial-gradient(circle at 84% 12%, rgba(250, 202, 120, 0.16), transparent 18%),
          linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
        color: var(--ink);
      }

      body {
        padding: 48px;
      }

      .frame {
        width: 100%;
        height: 100%;
        display: grid;
        grid-template-columns: 1.2fr 0.85fr;
        gap: 28px;
        align-items: stretch;
      }

      .card {
        border-radius: 8px;
        background: linear-gradient(180deg, var(--paper) 0%, #fffdfc 100%);
        border: 1px solid var(--paper-edge);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .note {
        display: grid;
        grid-template-rows: auto 1fr;
      }

      .bar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 18px 24px;
        background: #f6ede8;
        border-bottom: 1px solid #eaded8;
      }

      .dots {
        display: flex;
        gap: 8px;
      }

      .dot {
        width: 11px;
        height: 11px;
        border-radius: 999px;
        background: #dbc8c0;
      }

      .dot:nth-child(1) {
        background: #f391a0;
      }

      .dot:nth-child(2) {
        background: #f1be6a;
      }

      .dot:nth-child(3) {
        background: #95c77f;
      }

      .filename {
        margin: 0;
        font-size: 19px;
        color: var(--muted);
      }

      .content {
        padding: 34px 32px 30px;
        display: grid;
        align-content: start;
        gap: 18px;
      }

      .eyebrow {
        margin: 0;
        font-size: 15px;
        color: var(--muted);
      }

      h1 {
        margin: 0;
        font-size: 46px;
        line-height: 1.18;
        letter-spacing: 0;
      }

      .copy {
        margin: 0;
        white-space: pre-line;
        font-size: 27px;
        line-height: 1.65;
      }

      .hint {
        margin: 0;
        font-size: 18px;
        color: var(--muted);
      }

      .meta {
        padding: 26px 24px;
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 18px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.68) 0%, rgba(255, 255, 255, 0.92) 100%);
      }

      .pill {
        justify-self: start;
        padding: 10px 16px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 16px;
        font-weight: 700;
      }

      .summary {
        display: grid;
        align-content: start;
        gap: 16px;
      }

      .summary h2 {
        margin: 0;
        font-size: 30px;
        line-height: 1.3;
      }

      .summary p {
        margin: 0;
        font-size: 21px;
        line-height: 1.7;
        color: #5b4f4a;
      }

      .url {
        align-self: end;
        padding: 18px 20px;
        border-radius: 8px;
        background: #fff8f8;
        border: 1px solid #f0d7de;
      }

      .url-label {
        margin: 0 0 8px;
        font-size: 14px;
        color: var(--muted);
        text-transform: uppercase;
      }

      .url-value {
        margin: 0;
        font-size: 21px;
        line-height: 1.4;
        color: #3a3030;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <main class="frame">
      <section class="card note">
        <div class="bar">
          <div class="dots" aria-hidden="true">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
          <p class="filename">520_confession_letter.txt</p>
        </div>
        <div class="content">
          <p class="eyebrow">TEXT PREVIEW</p>
          <h1>有些话，还是想认真和你说</h1>
          <p class="copy">终于到520了。

其实有些话，我真的很早就想对你说了。

我把它们整理成了一页小小的信。</p>
          <p class="hint">点开继续看，后面还有没写完的内容。</p>
        </div>
      </section>

      <aside class="card meta">
        <div class="pill">520 特别版</div>
        <div class="summary">
          <h2>像一张认真写好的小卡片</h2>
          <p>让 QQ 空间优先抓到标题、摘要和封面，而不是只露出一串生硬链接。</p>
        </div>
        <div class="url">
          <p class="url-label">Link</p>
          <p class="url-value">Azusan0.github.io/Love_Joker/</p>
        </div>
      </aside>
    </main>
  </body>
</html>
