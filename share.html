    <style>
      :root {
        color-scheme: light;
        --bg-1: #fff4f6;
        --bg-2: #fff8f1;
        --paper: rgba(255, 252, 249, 0.96);
        --paper-edge: rgba(233, 220, 213, 0.96);
        --ink: #2d2423;
        --muted: #7b6a64;
        --accent: #e96a82;
        --shadow: 0 28px 80px rgba(74, 40, 46, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        background:
          radial-gradient(circle at 20% 18%, rgba(233, 106, 130, 0.16), transparent 24%),
          radial-gradient(circle at 84% 12%, rgba(250, 202, 120, 0.16), transparent 18%),
          linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
        color: var(--ink);
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
      }

      .card {
        width: min(92vw, 760px);
        border-radius: 8px;
        background: linear-gradient(180deg, var(--paper) 0%, #fffdfc 100%);
        border: 1px solid var(--paper-edge);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .bar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 18px;
        background: #f4ece7;
        border-bottom: 1px solid #eadfd8;
      }

      .dots {
        display: flex;
        gap: 6px;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #d8c6be;
      }

      .dot:nth-child(1) {
        background: #f391a0;
      }

      .dot:nth-child(2) {
        background: #f2bc67;
      }

      .dot:nth-child(3) {
        background: #93c881;
      }

      .title {
        margin: 0;
        font-size: 14px;
        color: var(--muted);
      }

      .body {
        padding: 28px 24px 24px;
      }

      h1 {
        margin: 0 0 14px;
        font-size: clamp(28px, 4vw, 38px);
        line-height: 1.25;
      }

      p {
        margin: 0;
        font-size: 17px;
        line-height: 1.8;
        color: #4f4340;
      }

      .jump {
        margin-top: 18px;
        font-size: 14px;
        color: var(--muted);
      }
    </style>
