    <style>
      :root {
        color-scheme: light;
        --bg-1: #fff4f6;
        --bg-2: #fff8f1;
        --paper: rgba(255, 252, 249, 0.96);
        --ink: #2d2423;
        --muted: #7b6a64;
        --shadow: 0 28px 80px rgba(67, 85, 120, 0.12);
        --border: rgba(209, 216, 228, 0.72);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        background:
          radial-gradient(circle at 20% 18%, rgba(154, 190, 255, 0.16), transparent 24%),
          radial-gradient(circle at 84% 12%, rgba(255, 212, 228, 0.16), transparent 18%),
          linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
        color: var(--ink);
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
      }

      .card {
        width: min(92vw, 760px);
        border-radius: 8px;
        background: linear-gradient(180deg, var(--paper) 0%, #fffdfc 100%);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .bar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 18px;
        background: #f4ece7;
        border-bottom: 1px solid #eadfd8;
      }

      .avatar {
        width: 42px;
        height: 42px;
        border-radius: 999px;
        background: linear-gradient(135deg, #262a35 0%, #5a6476 100%);
      }

      .title-box {
        display: grid;
        gap: 3px;
      }

      .title {
        margin: 0;
        font-size: 16px;
        color: #181b20;
        font-weight: 700;
      }

      .sub {
        margin: 0;
        font-size: 12px;
        color: var(--muted);
      }

      .body {
        padding: 24px 24px 22px;
      }

      .line {
        margin: 0 0 6px;
        font-size: 17px;
        line-height: 1.7;
        color: #25282e;
      }

      .line--tail {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .fade {
        height: 24px;
        margin-top: -14px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0), rgba(255, 253, 252, 1));
      }

      .jump {
        margin-top: 6px;
        font-size: 14px;
        color: #98a7bc;
      }
    </style>
    <script>
      window.addEventListener("load", () => {

    <main class="card" aria-label="分享入口页">

          <p class="sub">今天 19:18</p>

      <div class="body">
        <p class="line">终于到520了其实有些话我真的很早就想对你说了</p>
        <p class="line">这些天每次想到你我都觉得应该认真一点把那些</p>
        <p class="line">别扭犹豫心动和小小的期待慢慢写给你看所以我</p>
        <p class="line line--tail">把它们整理成了一封小小的信想趁今天发给你如果你愿意的话就继续往下看吧…</p>
        <div class="fade" aria-hidden="true"></div>
        <p class="jump">查看全文</p>
      </div>
    </main>
